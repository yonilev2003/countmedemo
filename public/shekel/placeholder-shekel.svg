<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" width="140" height="160">
  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D3B66"/>
      <stop offset="100%" stop-color="#1a4d80"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Subtle ground shadow -->
  <ellipse cx="70" cy="148" rx="40" ry="6" fill="#0D3B66" opacity="0.12"/>
  <!-- Speech-bubble body holding ✦ icon -->
  <path d="M 70 16 C 100 16, 118 38, 118 64 C 118 90, 100 110, 78 112 L 70 130 L 62 112 C 40 110, 22 90, 22 64 C 22 38, 40 16, 70 16 Z" fill="url(#bubble)" filter="url(#soft)"/>
  <!-- Shekel sparkle ✦ -->
  <text x="70" y="74" text-anchor="middle" font-family="serif" font-size="36" font-weight="bold" fill="white">✦</text>
  <!-- "שקל" label below -->
  <text x="70" y="94" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#9FB878" letter-spacing="1">שקל</text>
  <!-- Small "pointing" arrow extending from the bubble -->
  <path d="M 95 95 L 118 108 L 110 110 L 113 122 L 105 122 L 100 110 L 92 108 Z" fill="#9FB878"/>
</svg>
