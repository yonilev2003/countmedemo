<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CountMe — מסכי התחברות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --navy:#083A4F; --navy-900:#052532; --navy-700:#0C4860;
    --beige:#C8B59A; --beige-600:#AD9A7B;
    --aqua:#C0D5D6; --teal:#407E8C; --teal-600:#356a77;
    --sand:#E5E1DD; --sand-50:#F1EFEA; --paper:#FAF9F6;
    --ink:#0B2027;
    --font:'Assistant',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  html,body{font-family:var(--font);-webkit-font-smoothing:antialiased;color:var(--ink)}
  body{min-height:100vh;background:var(--sand-50);padding:56px 40px 80px}

  .pagehead{max-width:1180px;margin:0 auto 44px}
  .ph-eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--teal-600);margin-bottom:14px;text-transform:uppercase}
  .ph-eyebrow .d{width:7px;height:7px;border-radius:50%;background:var(--beige)}
  .pagehead h1{font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
  .pagehead p{margin-top:10px;font-size:16px;color:#5a6b71;max-width:640px;line-height:1.6}
  .pagehead .hint{margin-top:14px;font-size:13px;color:#869199}

  .sec{max-width:1180px;margin:0 auto 64px}
  .sec-label{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .sec-label h2{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--navy);text-transform:uppercase}
  .sec-label .line{flex:1;height:1px;background:rgba(8,58,79,.16)}
  .frames{display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start}
  .frame-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  .frame-cap{font-size:13px;font-weight:600;color:#5a6b71}

  /* device */
  .ios{width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#000;box-shadow:0 40px 80px rgba(8,40,55,.3), 0 0 0 1px rgba(0,0,0,.12);flex-shrink:0}
  .ios .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:22px;background:#000;z-index:50}
  .ios .statusbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 26px;color:#fff}
  .ios .statusbar .t{font-size:15px;font-weight:700;letter-spacing:.02em;font-feature-settings:"tnum"}
  .ios .statusbar .r{display:flex;align-items:center;gap:7px}
  .ios .homebar{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:100px;background:rgba(255,255,255,.7);z-index:60}

  /* glass screen — light greige */
  /* glass screen — navy / teal */
  .cm-screen{position:relative;width:100%;height:100%;overflow:hidden;background:#0c4860}
  .cm-bg{position:absolute;inset:-8%;width:116%;height:116%;background-size:cover;background-position:center;filter:blur(2px) saturate(106%);transform:translateZ(0)}
  .cm-bg.gradient{
    background:
      radial-gradient(60% 46% at 80% 6%, rgba(192,213,214,.30) 0%, rgba(192,213,214,0) 60%),
      radial-gradient(74% 58% at 8% 100%, rgba(64,126,140,.55) 0%, rgba(64,126,140,0) 62%),
      radial-gradient(46% 38% at 96% 90%, rgba(165,141,102,.22) 0%, rgba(165,141,102,0) 60%),
      linear-gradient(157deg,#0e4f68 0%,#0a4358 46%,#062c3b 100%);
    filter:none;}
  .cm-glass-wash{position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(180deg, rgba(192,213,214,.10) 0%, rgba(8,40,55,.06) 44%, rgba(5,30,40,.42) 100%),
      radial-gradient(140% 70% at 80% 4%, rgba(192,213,214,.16), rgba(192,213,214,0) 55%);}

  .cm-photo-btn{position:absolute;top:62px;inset-inline-start:18px;z-index:30;display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:11.5px;font-weight:600;color:#fff;cursor:pointer;padding:6px 11px;border-radius:999px;background:rgba(20,18,14,.3);border:1px solid rgba(255,255,255,.34);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .cm-photo-btn:hover{background:rgba(20,18,14,.44)}
  .cm-photo-btn svg{width:13px;height:13px}

  .cm-screen-inner{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;padding:100px 30px 44px}
  .cm-body{display:flex;flex-direction:column;color:#fff;height:100%}

  .cm-logo{display:flex;align-items:center;gap:11px;margin-bottom:30px}
  .cm-logo .lw{font-size:23px;font-weight:800;letter-spacing:-.02em;color:#fff}
  .cm-web-card .cm-logo .lw{color:var(--navy)}

  .cm-title{font-size:29px;font-weight:700;line-height:1.18;letter-spacing:-.01em;margin-bottom:30px;text-shadow:0 1px 16px rgba(40,34,26,.28)}
  .cm-title b{color:var(--beige);font-weight:800}
  .cm-title b.acc-name{color:rgb(200, 181, 154)}
  .cm-web-card .cm-title b.acc-name{color:rgb(162, 204, 224)}
  .cm-web-card .cm-title{font-size:27px;margin-bottom:26px;color:var(--navy);text-shadow:none}
  .cm-web-card .cm-title b{color:var(--beige-600)}

  .cm-fields{display:flex;flex-direction:column}
  .cm-field{display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.5);padding:9px 2px;margin-bottom:14px}
  .cm-input{flex:1;min-width:0;background:transparent;border:none;outline:none;font-family:var(--font);font-size:16px;font-weight:500;color:#fff;padding:4px 0;text-align:right}
  .cm-input::placeholder{color:rgba(255,255,255,.82);font-weight:400}
  .cm-forgot{font-size:13px;color:rgba(255,255,255,.86);text-decoration:none;white-space:nowrap;font-weight:600;cursor:pointer}
  .cm-forgot:hover{color:#fff}
  .cm-web-card .cm-field{border-bottom-color:rgba(8,40,55,.2)}
  .cm-web-card .cm-input{color:var(--navy)}
  .cm-web-card .cm-input::placeholder{color:rgba(11,32,39,.45)}
  .cm-web-card .cm-forgot{color:var(--teal)}
  .cm-web-card .cm-forgot:hover{color:var(--navy)}

  .cm-row-remember,.cm-row-terms{display:flex;align-items:flex-start;gap:11px;margin-top:22px;font-size:13.5px;color:rgba(255,255,255,.92);line-height:1.5}
  .cm-row-terms{margin-top:20px;font-size:12.5px}
  .cm-row-remember{align-items:center}
  .cm-row-remember span{white-space:nowrap}
  .cm-row-terms a,.cm-row-remember a{color:#fff;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
  .cm-web-card .cm-row-remember,.cm-web-card .cm-row-terms{color:rgba(11,32,39,.78)}
  .cm-web-card .cm-row-terms a,.cm-web-card .cm-row-remember a{color:var(--navy)}
  .cm-check{width:22px;height:22px;flex-shrink:0;border-radius:7px;cursor:pointer;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.18);display:grid;place-items:center;color:var(--navy);transition:all .16s ease;padding:0}
  .cm-check.on{background:var(--beige);border-color:var(--beige);color:var(--navy)}
  .cm-web-card .cm-check{border-color:rgba(8,40,55,.35);background:rgba(255,255,255,.6);color:var(--navy)}
  .cm-web-card .cm-check.on{background:var(--beige);border-color:var(--beige)}

  .cm-actions{display:flex;flex-direction:column;gap:14px;margin-top:30px}
  .cm-btn-dark,.cm-btn-light{height:54px;border-radius:999px;border:none;cursor:pointer;font-family:var(--font);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s ease,box-shadow .2s ease,background .2s ease}
  .cm-btn-dark{background:var(--navy);color:#fff;box-shadow:0 12px 28px -10px rgba(5,30,40,.6)}
  .cm-btn-dark:hover{transform:translateY(-1px);background:var(--navy-900)}
  .cm-btn-light{background:#fff;color:var(--navy);box-shadow:0 8px 22px -12px rgba(40,34,26,.4)}
  .cm-btn-light:hover{transform:translateY(-1px);box-shadow:0 14px 30px -14px rgba(40,34,26,.5)}
  .cm-btn-light svg{flex-shrink:0}
  .cm-spacer{flex:1;min-height:18px}

  .cm-foot{text-align:center;font-size:14px;color:rgba(255,255,255,.88);font-weight:500;padding-top:8px}
  .cm-foot a{color:#fff;font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--beige);padding-bottom:1px;cursor:pointer}
  .cm-web-card .cm-foot{color:rgba(11,32,39,.7);margin-top:24px}
  .cm-web-card .cm-foot a{color:var(--navy);border-bottom-color:var(--beige-600)}

  /* web */
  .cm-web{position:relative;width:100%;height:100%;overflow:hidden;border-radius:18px;background:#0c4860}
  .cm-web-grid{position:relative;z-index:5;height:100%;display:flex;align-items:center;justify-content:center;gap:74px;padding:0 7%}
  .cm-web-brand{max-width:360px;color:#fff}
  .cm-web-brand .cm-logo{margin-bottom:26px}
  .cm-web-brand .cm-logo .lw{font-size:30px}
  .cm-web-brand h2{font-size:34px;font-weight:800;line-height:1.18;letter-spacing:-.02em;text-shadow:0 2px 18px rgba(40,34,26,.35)}
  .cm-web-tag{margin-top:16px;font-size:17px;line-height:1.6;color:rgba(255,255,255,.92);text-shadow:0 1px 12px rgba(40,34,26,.3)}
  .cm-web-card{width:418px;flex-shrink:0;border-radius:26px;padding:38px 40px 32px;background:rgba(255,253,250,.62);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);border:1px solid rgba(255,255,255,.75);box-shadow:0 30px 70px -28px rgba(40,34,26,.45), inset 0 1px 0 rgba(255,255,255,.8)}
  .cm-web-card .cm-body{color:var(--navy)}
  .cm-web-card .cm-actions{margin-top:24px}
  .cm-web-card .cm-spacer{display:none}
  .cm-web-card .cm-screen-inner{padding:0}

  @media(max-width:820px){ .cm-web-grid{gap:40px;padding:0 5%} .cm-web-brand{display:none} }
</style>
</head>
<body>

  <div class="pagehead">
    <div class="ph-eyebrow"><span class="d"></span>CountMe · Auth</div>
    <h1>מסכי התחברות</h1>
    <p>סגנון זכוכית בגווני greige רכים, רקע מטושטש מאחורי הזכוכית, טיפוגרפיית Assistant (בנוסח gov.il / Almoni). הכל בעברית, RTL.</p>
    <p class="hint">לחצו "הרשמה" / "התחברות" למעבר בין המסכים · "החלף רקע" להעלאת תמונה משלכם</p>
  </div>

  <div class="sec">
    <div class="sec-label"><h2>מובייל</h2><div class="line"></div></div>
    <div class="frames" id="mobile-root"></div>
  </div>

  <div class="sec">
    <div class="sec-label"><h2>ווב</h2><div class="line"></div></div>
    <div id="web-root"></div>
  </div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">



const { useState, useRef } = React;

function LogoMark({ size = 34, color = "#C8B59A" }) {
  return (
    <svg width={size} height={size * 1.12} viewBox="0 0 100 112" fill="none" aria-hidden="true">
      <path d="M72.1 31.5 A33 33 0 1 0 72.1 80.5" stroke={color} strokeWidth="11" strokeLinecap="round" />
      <line x1="50" y1="15" x2="50" y2="97" stroke={color} strokeWidth="10" strokeLinecap="round" />
    </svg>);

}

function GoogleIcon() {
  return (
    <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
    </svg>);

}

function CheckBox({ checked, onClick }) {
  return (
    <button type="button" className={"cm-check" + (checked ? " on" : "")} onClick={onClick} aria-pressed={checked}>
      {checked && <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5" /></svg>}
    </button>);

}

function Field({ placeholder, type = "text", trailing }) {
  return (
    <label className="cm-field">
      <input className="cm-input" type={type} placeholder={placeholder} dir="rtl" />
      {trailing}
    </label>);

}

function AuthBody({ initialMode = "login", showLogo = false }) {
  const [mode, setMode] = useState(initialMode);
  const [remember, setRemember] = useState(true);
  const [agree, setAgree] = useState(true);
  const login = mode === "login";
  return (
    <div className="cm-body">
      {showLogo && <div className="cm-logo"><LogoMark size={28} color="#C8B59A" /><span className="lw">CountMe</span></div>}
      <h1 className="cm-title">{login ? <>ברוכים השבים<br />ל<b className="acc-name" style={{ color: "rgb(112, 161, 188)" }}>CountMe</b></> : <>נעים להכיר,<br />בואו <b style={{ color: "rgb(159, 180, 191)" }}>נתחיל</b></>}</h1>
      <div className="cm-fields">
        {!login && <Field placeholder="שם מלא" />}
        <Field placeholder="שם משתמש / אימייל" />
        <Field placeholder="סיסמה" type="password" trailing={login ? <span className="cm-forgot">שכחת?</span> : null} />
      </div>
      {login ?
      <div className="cm-row-remember"><CheckBox checked={remember} onClick={() => setRemember(!remember)} /><span>זכור אותי</span></div> :

      <div className="cm-row-terms"><CheckBox checked={agree} onClick={() => setAgree(!agree)} /><span>בהרשמה אני מאשר/ת את <a>תנאי השימוש</a> ו<a>מדיניות הפרטיות</a></span></div>
      }
      <div className="cm-actions">
        <button type="button" className="cm-btn-dark">{login ? "התחברות" : "הרשמה"}</button>
        <button type="button" className="cm-btn-light"><GoogleIcon />{login ? "התחברות עם Google" : "הרשמה עם Google"}</button>
      </div>
      <div className="cm-spacer" />
      <div className="cm-foot">
        {login ? <>אין לך חשבון? <a onClick={() => setMode("signup")}>הרשמה</a></> : <>כבר יש לך חשבון? <a onClick={() => setMode("login")}>התחברות</a></>}
      </div>
    </div>);

}

function GlassBG({ slotKey }) {
  const [img, setImg] = useState(() => {try {return localStorage.getItem("cm-bg-" + slotKey) || "";} catch (e) {return "";}});
  const fileRef = useRef(null);
  const onPick = (e) => {
    const f = e.target.files && e.target.files[0];if (!f) return;
    const r = new FileReader();
    r.onload = () => {setImg(r.result);try {localStorage.setItem("cm-bg-" + slotKey, r.result);} catch (err) {}};
    r.readAsDataURL(f);
  };
  return (
    <>
      {img ? <div className="cm-bg" style={{ backgroundImage: `url(${img})` }} /> : <div className="cm-bg gradient" />}
      <div className="cm-glass-wash" />
      <button type="button" className="cm-photo-btn" onClick={() => fileRef.current && fileRef.current.click()}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="9" cy="11" r="2" /><path d="M3 17l5-4 4 3 4-4 5 5" /></svg>
        החלף רקע
      </button>
      <input ref={fileRef} type="file" accept="image/*" onChange={onPick} style={{ display: "none" }} />
    </>);

}

function StatusBar() {
  return (
    <div className="statusbar">
      <span className="t">9:41</span>
      <span className="r">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><rect x="0" y="6.5" width="3" height="4.5" rx="1" /><rect x="4.5" y="4" width="3" height="7" rx="1" /><rect x="9" y="1.7" width="3" height="9.3" rx="1" /><rect x="13.5" y="0" width="3" height="11" rx="1" opacity=".4" /></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="#fff"><path d="M8 2.2c2 0 3.8.8 5.2 2l1.1-1.2A9.3 9.3 0 008 .2 9.3 9.3 0 001.7 3l1.1 1.2A7.4 7.4 0 018 2.2z" /><path d="M8 5.4c1.1 0 2.1.4 2.9 1.2l1.1-1.2A6 6 0 008 3.6 6 6 0 004 5.4l1.1 1.2A4.1 4.1 0 018 5.4z" /><circle cx="8" cy="9" r="1.6" /></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="#fff" opacity=".5" /><rect x="2" y="2" width="16.5" height="8" rx="1.6" fill="#fff" /><path d="M23 4v4a2 2 0 000-4z" fill="#fff" opacity=".6" /></svg>
      </span>
    </div>);

}

function MobileAuth({ initialMode = "login", slotKey }) {
  return (
    <div className="ios">
      <div className="island" />
      <StatusBar />
      <div className="homebar" />
      <div className="cm-screen">
        <GlassBG slotKey={slotKey} />
        <div className="cm-screen-inner"><AuthBody initialMode={initialMode} showLogo={true} /></div>
      </div>
    </div>);

}

function WebAuth({ initialMode = "login", slotKey }) {
  return (
    <div style={{ width: "100%", maxWidth: 1180, height: 660, boxShadow: "0 40px 90px -30px rgba(40,34,26,.45)", borderRadius: 18, overflow: "hidden" }}>
      <div className="cm-web" dir="rtl">
        <GlassBG slotKey={slotKey} />
        <div className="cm-web-grid">
          <div className="cm-web-brand">
            <div className="cm-logo"><LogoMark size={34} color="#C8B59A" /><span className="lw">CountMe</span></div>
            <h2>השקט הנפשי שמגיע לעצמאים שלך.</h2>
            <p className="cm-web-tag">כל מועדי הדיווח, המע״מ והמקדמות — במקום אחד, בזמן. אנחנו סופרים, אתם עובדים.</p>
          </div>
          <div className="cm-web-card">
            <div className="cm-screen-inner"><AuthBody initialMode={initialMode} /></div>
          </div>
        </div>
      </div>
    </div>);

}

const { createRoot } = ReactDOM;
createRoot(document.getElementById("mobile-root")).render(
  <>
    <div className="frame-wrap"><MobileAuth initialMode="login" slotKey="mob-login" /><div className="frame-cap">התחברות</div></div>
    <div className="frame-wrap"><MobileAuth initialMode="signup" slotKey="mob-signup" /><div className="frame-cap">הרשמה</div></div>
  </>
);
createRoot(document.getElementById("web-root")).render(<WebAuth initialMode="login" slotKey="web-login" />);
</script>
</body>
</html>
