# CI test gate — the contract on the tax engine.
#
# Runs on every PR to main, every push to main, AND every push to a claude/*
# branch: build + golden tests + e2e. A red run blocks the merge (enable
# branch protection on main with this workflow as a required status check —
# one-time manual step in repo settings).
#
# The claude/* push trigger exists because CI does NOT run on a branch with no
# open PR — found 2026-08-03 when a branch (claude/system-beta-preparation-
# oiyzpy) kept 5 more commits after its own PR had already merged and sat
# untested for over a week, undetected, since nothing was watching it. Every
# AI session branch (per CLAUDE.md's `claude/<short-name>` convention) now
# gets validated the moment it's pushed, whether or not a PR exists yet.
#
# The e2e job uses dummy Supabase env values: with AUTH_GATING_ENABLED unset
# the app runs signed-out, which is exactly the flow the suite covers. No
# secrets are needed; API tests assert validation behavior (400s), not model
# output.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "claude/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
      - name: Golden tests (tax engine contract)
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        run: npx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
